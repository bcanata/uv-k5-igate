[package]
name = "uv-k5-igate"
version = "0.1.1"
description = "UV-K5 APRS iGate — desktop companion for the TA1JS APRS firmware"
authors = ["Buğra Canata TA1JS"]
license = "Apache-2.0"
edition = "2021"

[lib]
name = "uv_k5_igate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"

[profile.release]
opt-level = "s"
lto = true
strip = true
